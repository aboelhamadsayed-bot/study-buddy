name: Gemini CLI Dispatch

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  dispatch:
    if: >-
      ${{ github.event.sender.type == 'User' &&
      startsWith(github.event.comment.body || github.event.review.body || '', '@gemini-cli') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
      github.event.comment.author_association || github.event.review.author_association || '') }}
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.parse.outputs.command }}
      context: ${{ steps.parse.outputs.context }}
    steps:
      - id: parse
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          REQUEST: ${{ github.event.comment.body || github.event.review.body }}
        with:
          script: |
            const request = process.env.REQUEST || "";
            const command = request.startsWith("@gemini-cli /approve") ? "approve"
              : request.startsWith("@gemini-cli") ? "invoke" : "ignore";
            core.setOutput("command", command);
            core.setOutput("context", request.replace(/^@gemini-cli(?: \/approve)?/, "").trim());
      - name: Acknowledge
        if: steps.parse.outputs.command != 'ignore'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          COMMAND: ${{ steps.parse.outputs.command }}
        run: |
          if [ "$COMMAND" = "approve" ]; then
            MESSAGE="Gemini received the approval request and is starting the approved plan."
          else
            MESSAGE="Gemini received your request. It will inspect the project and post a plan; no code changes will be made until you approve it with @gemini-cli /approve."
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "$MESSAGE"
  invoke:
    needs: dispatch
    if: needs.dispatch.outputs.command == 'invoke'
    uses: ./.github/workflows/gemini-invoke.yml
    with:
      additional_context: ${{ needs.dispatch.outputs.context }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
  plan-execute:
    needs: dispatch
    if: needs.dispatch.outputs.command == 'approve'
    uses: ./.github/workflows/gemini-plan-execute.yml
    with:
      additional_context: ${{ needs.dispatch.outputs.context }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
