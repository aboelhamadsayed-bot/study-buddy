name: Qimma quality checks

on:
  pull_request:
    paths:
      - "index.html"
      - "docs/index.html"
      - ".github/workflows/qimma-quality.yml"
      - "supabase/migrations/**"
      - "supabase/functions/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Qimma HTML and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify synchronized pages and tutor integration
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess

          docs = Path("docs/index.html").read_bytes()
          root = Path("index.html").read_bytes()
          if docs != root:
              raise SystemExit("index.html and docs/index.html are not identical")

          source = docs.decode("utf-8")
          if "نسخة واجهة تجريبية" in source or "وصلني سؤالك!" in source:
              raise SystemExit("A placeholder assistant response is still present")
          required_integrations = [
              "functions.invoke('qimma-tutor'",
              "functions.invoke('qimma-assessments'",
              "from('student_progress').select",
              "from('student_posts').insert(payload)",
              "student_profiles').upsert(payload,"
          ]
          for marker in required_integrations:
              if marker not in source:
                  raise SystemExit(f"Missing required integration: {marker}")

          # Prevent obsolete demo handlers from overriding cloud-backed form handlers.
          if "$('#postForm').onsubmit=" in source or "$('#settingsForm').onsubmit=" in source:
              raise SystemExit("An obsolete local-only form handler is overriding a cloud integration")
          for marker in ["$('#postForm').addEventListener('submit'", "$('#settingsForm').addEventListener('submit'"]:
              if marker not in source:
                  raise SystemExit(f"Missing cloud-backed form handler: {marker}")

          # Guard against duplicate SDK downloads and unsupported grade values
          # that would create student accounts unable to save assessment results.
          if source.count("supabase-js@2") != 1:
              raise SystemExit("Load the Supabase browser SDK exactly once")
          for marker in ["!gradeToDb[grade]", "if(!schoolGrade)"]:
              if marker not in source:
                  raise SystemExit(f"Missing supported-grade validation: {marker}")
          if "<option>غير ذلك</option>" in source:
              raise SystemExit("Unsupported grade option is still exposed to students")
          for marker in ["new URL(b.file_url)", "fileUrl.protocol!=='https:'", "ellibrary.moe.gov.eg", "elearnningcontent.blob.core.windows.net"]:
              if marker not in source:
                  raise SystemExit(f"Missing safe PDF source validation: {marker}")

          migration_dir = Path("supabase/migrations")
          migration_files = sorted(migration_dir.glob("*.sql"))
          if len(migration_files) < 3:
              raise SystemExit("Expected assessment security and profile migrations are missing")
          migration_text = "\\n".join(path.read_text(encoding="utf-8") for path in migration_files)
          for marker in ["student_progress", "record_qimma_assessment", "student_profiles_school_grade_check", "student_posts_school_grade_check", "pg_advisory_xact_lock", "p_question_count < 1 or p_question_count > 20", "p_correct_count > p_question_count"]:
              if marker not in migration_text:
                  raise SystemExit(f"Missing migration content: {marker}")

          dynamic_rpc_migration = Path("supabase/migrations/20261031122000_support_dynamic_assessment_question_counts.sql")
          if not dynamic_rpc_migration.exists():
              raise SystemExit("Dynamic assessment RPC migration is missing")

          ai_exam_fn = Path("supabase/functions/qimma-ai-exams/index.ts")
          ai_exam_migration = Path("supabase/migrations/20261031123000_add_qimma_ai_generated_exams.sql")
          if not ai_exam_fn.exists() or not ai_exam_migration.exists():
              raise SystemExit("AI exam function or secure storage migration is missing")
          ai_exam_source = ai_exam_fn.read_text(encoding="utf-8")
          for marker in ["GEMINI_API_KEY", "submit_qimma_generated_exam", "qimma_generated_exams", "questions.length!==count", "safeQuestions"]:
              if marker not in ai_exam_source:
                  raise SystemExit(f"Missing AI exam security/validation behavior: {marker}")
          if "answer:q.answer" in ai_exam_source or "correct_choice" in ai_exam_source.split("const safeQuestions")[0]:
              raise SystemExit("AI exam answer key must not be returned to the browser")

          agent_runtime = Path("supabase/functions/_shared/qimma-agent-runtime.ts")
          agent_ids = ["smart-teacher", "lesson-summarizer", "exam-builder", "study-planner", "problem-solver", "language-coach", "learning-researcher", "academic-mentor"]
          if not agent_runtime.exists():
              raise SystemExit("Specialized agent runtime is missing")
          agent_runtime_text = agent_runtime.read_text(encoding="utf-8")
          for marker in ["consume_tutor_request", "GEMINI_API_KEY", "roles:Record", "handleAgent"]:
              if marker not in agent_runtime_text:
                  raise SystemExit(f"Missing specialized agent runtime behavior: {marker}")
          for agent_id in agent_ids:
              entry = Path(f"supabase/functions/qimma-agent-{agent_id}/index.ts")
              if not entry.exists() or f'handleAgent(req,"{agent_id}")' not in entry.read_text(encoding="utf-8"):
                  raise SystemExit(f"Missing independent agent endpoint: {agent_id}")
          if "qimma-agent-'+agent" not in source or 'id="chatAgent"' not in source:
              raise SystemExit("Assistant UI must route requests to the selected specialized agent")

          assessment_fn = Path("supabase/functions/qimma-assessments/index.ts")
          if not assessment_fn.exists():
              raise SystemExit("The assessment Edge Function source is missing")
          function_source = assessment_fn.read_text(encoding="utf-8")
          for marker in ["auth/v1/user", "record_qimma_assessment", "questions:banks[quiz.bank||quiz.subject].map", "questions.length", "Math.round(correct*100/questions.length)", "Daily assessment limit"]:
              if marker not in function_source:
                  raise SystemExit(f"Missing secure assessment behavior: {marker}")

          tutor_fn = Path("supabase/functions/qimma-tutor/index.ts")
          video_fn = Path("supabase/functions/qimma-videos/index.ts")
          if not tutor_fn.exists() or not video_fn.exists():
              raise SystemExit("All deployed Qimma Edge Function sources must be version-controlled")
          tutor_source = tutor_fn.read_text(encoding="utf-8")
          for marker in ["auth/v1/user", "consume_tutor_request", "GEMINI_API_KEY", "generativelanguage.googleapis.com/v1beta/models/", "gemini-3.5-flash-lite"]:
              if marker not in tutor_source:
                  raise SystemExit(f"Missing secure Gemini tutor behavior: {marker}")
          # Image upload validation and extraction must use the same supported MIME types.
          for marker in [r"data:image\/(jpeg|png|webp|gif);base64,", r"image.match(/^data:image\/(jpeg|png|webp|gif);base64,"]:
              if marker not in tutor_source:
                  raise SystemExit(f"Missing tutor image validation: {marker}")
          if r"image\\/" in tutor_source:
              raise SystemExit("Tutor image regex contains an invalid doubled escape")
          video_source = video_fn.read_text(encoding="utf-8")
          for marker in ["safeSearch: \"strict\"", "videoEmbeddable: \"true\"", "^[A-Za-z0-9_-]{11}$", "YOUTUBE_API_KEY"]:
              if marker not in video_source:
                  raise SystemExit(f"Missing safe video-search behavior: {marker}")
          if "Africa/Cairo" not in migration_text:
              raise SystemExit("Tutor and assessment daily limits must reset on Cairo local midnight")

          if source.count("e.target.closest('.open-subject')") != 1:
              raise SystemExit("Subject cards must have exactly one click handler")
          if "form.reportValidity()" not in source or "selected===null?null:Number(selected)" not in source or "item.question_count||5" not in source:
              raise SystemExit("Assessment submission must reject unanswered questions")
          if "Qimma assessment submission failed:" not in source or "saved.data.question_count||data.questions.length" not in source:
              raise SystemExit("Assessment submission must recover from network errors and display the actual question count")
          if "Math.random()" in source or "نقطة تجريبية" in source:
              raise SystemExit("Demo/random assessment scoring is not allowed")
          if any(secret in source for secret in ["OPENAI_API_KEY", "SUPABASE_SERVICE_ROLE_KEY", "GEMINI_API_KEY"]):
              raise SystemExit("A server-side secret appears in browser source")

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      attrs = dict(attrs)
                      self.current = [] if not attrs.get("src") else None
              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.current is not None:
                      self.scripts.append("".join(self.current))
                      self.current = None

          parser = InlineScripts()
          parser.feed(source)
          if not parser.scripts:
              raise SystemExit("No inline JavaScript blocks were found")
          for index, script in enumerate(parser.scripts):
              path = Path(f"/tmp/qimma-inline-{index}.js")
              path.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          print(f"Passed: synchronized pages and {len(parser.scripts)} JavaScript block(s).")
          PY
