name: Gemini CLI Approved Execution

on:
  workflow_call:
    inputs:
      additional_context:
        type: string
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare request context
        env:
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          DESCRIPTION: ${{ github.event.issue.body || github.event.pull_request.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ADDITIONAL_CONTEXT: ${{ inputs.additional_context }}
        run: |
          mkdir -p .gemini
          jq -n --arg title "$TITLE" --arg description "$DESCRIPTION" \
            --arg number "$ISSUE_NUMBER" --arg context "$ADDITIONAL_CONTEXT" \
            '{title:$title, description:$description, issue_number:$number, additional_context:$context}' \
            > .gemini/context.json
      - name: Run Gemini CLI (approved plan only)
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ${{ github.token }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: /gemini-plan-execute
          github_issue_number: ${{ github.event.issue.number }}
          github_pr_number: ${{ github.event.pull_request.number }}
          settings: |
            {
              "model": { "maxSessionTurns": 25 },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server:v0.27.0"],
                  "includeTools": ["add_issue_comment", "issue_read", "list_issues", "pull_request_read", "list_pull_requests", "create_pull_request", "create_branch", "create_or_update_file", "get_commit", "get_file_contents", "list_commits", "push_files", "search_code"],
                  "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}" }
                }
              },
              "tools": { "core": [] }
            }
